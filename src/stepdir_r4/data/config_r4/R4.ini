#CONFIGURAÇÃO PARA MAQUINA EIXO XYZA
[EMC]
MACHINE = R4
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
ARCDIVISION = 64
GRIDS = 10mm 20mm 50mm 100mm 1in 2in 5in 10in
MAX_FEED_OVERRIDE = 10
MIN_SPINDLE_OVERRIDE = 0.5
MAX_SPINDLE_OVERRIDE = 1

DEFAULT_LINEAR_VELOCITY = 50
MIN_LINEAR_VELOCITY = 0
MAX_LINEAR_VELOCITY = 150

DEFAULT_ANGULAR_VELOCITY = 15.00
MIN_ANGULAR_VELOCITY = 0
MAX_ANGULAR_VELOCITY = 100


PROGRAM_PREFIX =/home/r4/Área de trabalho/
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 5
INCREMENTS = 10mm 5mm 1mm .5mm .1mm .05mm .01mm .005mm
PYVCP  = custompanel.xml
TKPKG  = Ngcgui 1.0


[KINS]
JOINTS = 4
KINEMATICS = trivkins coordinates=XYZA


[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE   = linuxcnc.var
FEATURES = 12
ON_ABORT_COMMAND = o<.abort>call
RS274NGC_STARTUP_CODE = o<startup>call
SUBROUTINE_PATH = macros

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
COMM_WAIT = 0.010
SERVO_PERIOD   = 1000000

[HAL]
HALFILE = R4.hal
HALFILE = custom.hal
POSTGUI_HALFILE = postgui_call_list.hal
HALUI = halui


[HALUI]

MDI_COMMAND = o<g28>call
MDI_COMMAND = o<go_to_zero>call
MDI_COMMAND = o<safe_z>call
MDI_COMMAND = G10 L20 P0 X0
MDI_COMMAND = G10 L20 P0 Y0
MDI_COMMAND = G10 L20 P0 Z0
MDI_COMMAND = G54
MDI_COMMAND = G55
MDI_COMMAND = G56
MDI_COMMAND = o<probe_flutuante>call
MDI_COMMAND = G10 L20 P0 A0
MDI_COMMAND = o<probe_fixo>call
MDI_COMMAND = M3 S24000


[TRAJ]
COORDINATES =  X Y Z A
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
CYCLE_TIME = 0.010
DEFAULT_LINEAR_VELOCITY = 50
MAX_LINEAR_VELOCITY     = 150
NO_FORCE_HOMING =0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl



#******************************* EIXO X *******************************
