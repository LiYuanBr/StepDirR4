[build-system]
requires = ["setuptools>=62.3"]
build-backend = "setuptools.build_meta"

[project]
name = "stepdir-r4"
version = "0.1.3"
description = "Instalador e configurador da placa LinuxCNC StepDir R4"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[project.scripts]
stepdir-r4 = "stepdir_r4.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# "**/*" do setuptools NÃO casa dotfiles — macros/.abort.ngc (ON_ABORT_COMMAND
# do R4.ini) precisa do segundo padrão.
stepdir_r4 = ["data/**/*", "data/**/.*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
